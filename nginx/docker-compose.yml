services:
  app:
    image: 'jc21/nginx-proxy-manager:2.13.6'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Публичные порты
      - '80:80'    # HTTP
      - '443:443'  # HTTPS
      # Админ-панель: снаружи через npm.xetpy.ru, порт — только для SSH-туннеля
      - '127.0.0.1:81:81'
    volumes:
      # Конфигурация и данные
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - web-network  # общая сеть для всех
    healthcheck:
      # Скрипт из образа: проверяет API админки на 127.0.0.1:81
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

networks:
  web-network:
    external: true  # создаем отдельно
