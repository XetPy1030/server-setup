# Папка раньше называлась loki/. Имя проекта оставлено старым, иначе тома
# loki_grafana-storage, loki_prometheus-storage и т.д. создадутся заново пустыми.
name: loki

services:
  loki:
    image: grafana/loki:3.6.4
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
      - ./loki-rules:/etc/loki/rules
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  promtail:
    image: grafana/promtail:3.6.4
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - ./logs:/var/log/applogs:ro
      - promtail-positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:12.3.2
    container_name: grafana
    user: "472:472"
    ports:
      # Снаружи доступна через NPM (grafana.xetpy.ru), порт — только для SSH-туннеля
      - "127.0.0.1:8512:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Применяется только при первом запуске; дальше пароль меняется через
      # `grafana cli admin reset-admin-password`
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}
      - GF_SERVER_ROOT_URL=https://grafana.xetpy.ru
      - GF_USERS_ALLOW_SIGN_UP=false
      # Главная страница — дашборд «Серверы» (grafana-dashboards/servers.json)
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/servers.json
      - TZ=Europe/Moscow
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring-net
      - web-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # backup/backup.sh пишет сюда время последнего успешного бэкапа
      - ./node-exporter-textfile:/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile'
    restart: unless-stopped
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - ./prometheus-targets:/etc/prometheus/targets
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  # Состояние контейнеров для алертов — тот же скрипт, что на mtproto (host-metrics/)
  docker-metrics:
    image: docker:29.8.1-cli
    container_name: docker-metrics
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-metrics.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../host-metrics/docker-metrics.sh:/docker-metrics.sh:ro
      - ./node-exporter-textfile:/textfile
    network_mode: none
    deploy:
      resources:
        limits:
          memory: 32M

  # Проверки сайтов по HTTPS и портов (prometheus-targets/), docs/alerts.md
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    # Alertmanager не подставляет переменные окружения в конфиг — это делает entrypoint
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in monitoring/.env}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in monitoring/.env}
      - SMTP_USER=${SMTP_USER:?set SMTP_USER in monitoring/.env}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?set SMTP_PASSWORD in monitoring/.env}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO in monitoring/.env}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - ./alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - tg-relay
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # SOCKS-прокси до api.telegram.org: ssh на сервер mtproto, с web Telegram не открывается.
  # Ключ и known_hosts — в tg-relay-secrets/, только на сервере. На mtproto ключ ограничен
  # в authorized_keys пользователя tgrelay: только соединения с api.telegram.org:443.
  tg-relay:
    build: ./tg-relay
    container_name: tg-relay
    restart: unless-stopped
    command: >-
      ssh -N -D 0.0.0.0:1080
      -i /keys/id_ed25519 -o UserKnownHostsFile=/keys/known_hosts -o StrictHostKeyChecking=yes
      -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3
      tgrelay@${TG_RELAY_HOST:?set TG_RELAY_HOST in monitoring/.env}
    volumes:
      - ./tg-relay-secrets:/keys:ro
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  loki-data:
  grafana-storage:
  prometheus-storage:
  promtail-positions:
  alertmanager-data:

networks:
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  web-network:
    external: true
