# Папка раньше называлась loki/. Имя проекта оставлено старым, иначе тома
# loki_grafana-storage, loki_prometheus-storage и т.д. создадутся заново пустыми.
name: loki

services:
  loki:
    image: grafana/loki:3.6.4
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
      - ./loki-rules:/etc/loki/rules
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  promtail:
    image: grafana/promtail:3.6.4
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - ./logs:/var/log/applogs:ro
      - promtail-positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:12.3.2
    container_name: grafana
    user: "472:472"
    ports:
      # Снаружи доступна через NPM (grafana.xetpy.ru), порт — только для SSH-туннеля
      - "127.0.0.1:8512:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Применяется только при первом запуске; дальше пароль меняется через
      # `grafana cli admin reset-admin-password`
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}
      - GF_SERVER_ROOT_URL=https://grafana.xetpy.ru
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Europe/Moscow
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring-net
      - web-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - ./prometheus-targets:/etc/prometheus/targets
      - ./prometheus-secrets:/etc/prometheus/secrets:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net

volumes:
  loki-data:
  grafana-storage:
  prometheus-storage:
  promtail-positions:

networks:
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  web-network:
    external: true
