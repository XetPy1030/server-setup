global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Django obsidiantime — пока через публичный адрес (docs/roadmap.md, этап 4)
  - job_name: django
    static_configs:
      - targets: ['obsidiantime.ru']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Проверки через blackbox-exporter: target — что проверять, а запрос идёт в blackbox.
  - job_name: sites
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 60s
    scrape_timeout: 15s
    file_sd_configs:
      - files: [/etc/prometheus/targets/sites.yml]
    relabel_configs: &blackbox
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Порт прокси снаружи. Адрес — в targets/mtproto.yml, он только на сервере (репа публичная).
  - job_name: mtproto
    metrics_path: /probe
    params:
      module: [tcp_connect]
    scrape_interval: 60s
    scrape_timeout: 15s
    file_sd_configs:
      - files: [/etc/prometheus/targets/mtproto.yml]
    relabel_configs: *blackbox

  # Туннель до Telegram: порт открыт, только пока ssh до mtproto подключён.
  - job_name: tg-relay
    metrics_path: /probe
    params:
      module: [tcp_connect]
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ['tg-relay:1080']
    relabel_configs: *blackbox
