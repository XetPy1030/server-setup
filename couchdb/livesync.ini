; Настройки CouchDB под Obsidian Self-hosted LiveSync. Те же, что выставляет
; utils/couchdb/couchdb-init.sh из репозитория плагина, только файлом, а не через API.
; CouchDB читает файл при старте; после правки couchdb/reload.sh перезапустит контейнер.

[couchdb]
; Одна нода: системные базы (_users, _replicator) создаются сами при старте
single_node = true
; Крупные вложения LiveSync
max_document_size = 50000000

[chttpd]
; Без пароля — ничего, кроме /_up (healthcheck контейнера и проверка blackbox)
require_valid_user = true
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; Obsidian на компьютере, Obsidian на телефоне
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
